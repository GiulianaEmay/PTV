<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesion - Emay Tech</title>
  <link rel="icon" type="image/png" href="assets/emay-logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body class="pagina-login">
  <div class="panel-hero">
    <img src="assets/login-hero.webp" alt="Emay Tech - Punto de venta" class="hero-imagen" />
  </div>

  <div class="panel-form">
    <p class="panel-form-etiqueta">EMAY TECH <span class="etiqueta-linea"></span> PUNTO DE VENTA</p>

    <form class="login-card" id="formLogin">
      <div class="logo-wrap logo-wrap-movil">
        <div class="logo-marca"></div>
      </div>

      <h1>Bienvenido <span class="texto-degradado">de nuevo</span></h1>
      <p>Ingresa con la cuenta que te dio tu proveedor para acceder al sistema.</p>

      <label>Correo electronico</label>
      <div class="campo-icono">
        <svg viewBox="0 0 20 20" fill="none"><path d="M3 5.5h14a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.4"/><path d="m2.5 6 7 5 7-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input type="email" id="email" required autocomplete="username" />
      </div>

      <label>Contrasena</label>
      <div class="campo-icono">
        <svg viewBox="0 0 20 20" fill="none"><rect x="4" y="9" width="12" height="8" rx="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 9V6.5a3.5 3.5 0 0 1 7 0V9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="password" id="password" required autocomplete="current-password" />
        <button type="button" class="btn-ver-clave" id="btnVerClave" aria-label="Mostrar contrasena">
          <svg viewBox="0 0 20 20" fill="none"><path d="M1.5 10S4.5 4.5 10 4.5 18.5 10 18.5 10 15.5 15.5 10 15.5 1.5 10 1.5 10Z" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="10" r="2.3" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>

      <div class="fila-opciones">
        <label class="check-recordar">
          <input type="checkbox" id="recordarSesion" checked />
          Recordar sesion
        </label>
      </div>

      <p id="loginError" class="error oculto"></p>

      <button type="submit" class="btn-principal btn-entrar">
        <span>Entrar</span>
        <svg viewBox="0 0 20 20" fill="none"><path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="login-footer">
        <div class="login-footer-linea"><span></span>EMAY TECH<span></span></div>
        <p class="login-seguridad">
          <svg viewBox="0 0 20 20" fill="none"><rect x="4" y="9" width="12" height="8" rx="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 9V6.5a3.5 3.5 0 0 1 7 0V9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          Tu informacion esta segura con nosotros
        </p>

        <div class="login-contactos">
          <p class="contactos-titulo">¿Necesitas ayuda?</p>
          <a href="tel:+51973982417" class="contacto-item">
            <svg viewBox="0 0 20 20" fill="none"><path d="M4 3.5h3l1.2 3.5-1.7 1.2a10 10 0 0 0 5.3 5.3l1.2-1.7 3.5 1.2v3c0 .8-.7 1.4-1.5 1.3-6-.6-10.8-5.4-11.4-11.4C3.5 4.9 4.2 3.5 4 3.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            <span><strong>Soporte general</strong> · Giuliana Maldonado · +51 973 982 417</span>
          </a>
          <a href="tel:+51927961756" class="contacto-item">
            <svg viewBox="0 0 20 20" fill="none"><path d="M4 3.5h3l1.2 3.5-1.7 1.2a10 10 0 0 0 5.3 5.3l1.2-1.7 3.5 1.2v3c0 .8-.7 1.4-1.5 1.3-6-.6-10.8-5.4-11.4-11.4C3.5 4.9 4.2 3.5 4 3.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            <span><strong>Operaciones</strong> · Lesly Gavidia · +51 927 961 756</span>
          </a>
        </div>
      </div>
    </form>
  </div>

  <script src="login.js"></script>
</body>
</html>
