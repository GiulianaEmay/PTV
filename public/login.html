<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesion - Emay Tech</title>
  <link rel="icon" type="image/png" href="assets/emay-logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body class="pagina-login">
  <div class="blob blob-superior" aria-hidden="true"></div>
  <div class="blob blob-inferior" aria-hidden="true"></div>

  <svg class="linea-decorativa" viewBox="0 0 1440 1024" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,120 C280,40 420,220 720,160 C1020,100 1180,260 1440,180" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" />
  </svg>

  <svg class="ilustracion-pos" viewBox="0 0 320 340" aria-hidden="true">
    <rect x="60" y="20" width="200" height="150" rx="14" fill="none" stroke="currentColor" stroke-width="4" />
    <rect x="82" y="44" width="60" height="10" rx="5" fill="currentColor" />
    <rect x="82" y="64" width="156" height="34" rx="6" fill="currentColor" opacity="0.5" />
    <rect x="82" y="106" width="70" height="46" rx="6" fill="currentColor" opacity="0.35" />
    <rect x="160" y="106" width="78" height="46" rx="6" fill="currentColor" opacity="0.35" />
    <path d="M150 170 L170 170 L178 200 L142 200 Z" fill="currentColor" opacity="0.6" />
    <rect x="70" y="200" width="180" height="80" rx="10" fill="none" stroke="currentColor" stroke-width="4" />
    <rect x="90" y="220" width="140" height="12" rx="6" fill="currentColor" opacity="0.4" />
    <rect x="90" y="242" width="90" height="10" rx="5" fill="currentColor" opacity="0.3" />
  </svg>

  <form class="login-card" id="formLogin">
    <div class="logo-wrap">
      <div class="logo-marca"></div>
      <span class="logo-linea"></span>
    </div>

    <h1>Bienvenido <span class="texto-degradado">de nuevo</span></h1>
    <p>Ingresa con la cuenta que te dio tu proveedor para acceder al sistema.</p>

    <label>Correo</label>
    <div class="campo-icono">
      <svg viewBox="0 0 20 20" fill="none"><path d="M3 5.5h14a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.4"/><path d="m2.5 6 7 5 7-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <input type="email" id="email" required autocomplete="username" />
    </div>

    <label>Contrasena</label>
    <div class="campo-icono">
      <svg viewBox="0 0 20 20" fill="none"><rect x="4" y="9" width="12" height="8" rx="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 9V6.5a3.5 3.5 0 0 1 7 0V9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input type="password" id="password" required autocomplete="current-password" />
    </div>

    <p id="loginError" class="error oculto"></p>

    <button type="submit" class="btn-principal btn-entrar">
      <span>Entrar</span>
      <svg viewBox="0 0 20 20" fill="none"><path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </form>

  <script src="login.js"></script>
</body>
</html>
